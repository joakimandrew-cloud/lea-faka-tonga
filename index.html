<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico?v=4" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png?v=4" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Search Console ownership proof for https://leafakatonga.org.
         Verified 2026-08-20. Removing this line un-verifies the property. -->
    <meta name="google-site-verification" content="BaJb4j06t1KtcxFrBjU1vbr-iCGHMz0hAT6rFfVWNXE" />
    <meta name="description" content="Learn Tongan, free. A complete 52-lesson course with drills, quizzes and flip cards. Find your Tongan, whether it's your family's language, you married into it, or you just love Tonga." />
    <!-- Fonts are self-hosted via @fontsource (imported in src/main.jsx) —
         no external font requests. -->
    <title>Lea Faka-Tonga · Learn Tongan, free</title>
    <!-- GoatCounter — private, cookieless, no cookie banner. SPA navigations
         are counted by <RouteChrome>; this counts the initial load. -->
    <script
      data-goatcounter="https://leafakatonga.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
    <script>
      // Single Page Apps for GitHub Pages — restore route after 404.html bounce.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
